name: CI

# `push` ne couvre plus `campaign/**/integration` depuis le 2026-08-07 : chaque
# poussée sur une branche de campagne avec PR ouverte payait DEUX runs `verify`
# de ~11 min, alors que la protection de branche n'exige que le check du run
# `pull_request`. `push` sur `main` reste — c'est la vérification du commit
# réellement fusionné, celle qui n'a pas de PR pour la porter.
# Revers assumé : une branche de campagne SANS PR ouverte ne déclenche plus
# rien. Le CI d'une campagne vit dans sa PR.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "campaign/**/integration"

# Sur `main`, jamais deux runs dans le même groupe (gardé par
# `scripts/ci-invariants.test.mjs`). Récit : docs/adr/2026-08-07-commentaires-workflows.md.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Image PostgreSQL 15 + extension pgvector précompilée : la migration
        # 20260721090000_add_pgvector_rag exécute CREATE EXTENSION vector.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wellneuro_ci
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/wellneuro_ci
      NEXTAUTH_SECRET: ci-test-secret-r8-2-playwright-automation
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          # Nécessaire pour comparer le diff à sa base et détecter une PR
          # purement documentaire (étape « Périmètre du diff » ci-dessous).
          fetch-depth: 0

      # Le nom du job reste `verify` : les règles de protection de branche
      # continuent d'exiger exactement ce check, quel que soit le périmètre.
      # Une PR documentaire n'a aucune raison d'installer des navigateurs et de
      # rejouer les E2E — mais elle DOIT rester soumise à l'anti-secrets (un
      # secret se colle aussi bien dans un .md) et à l'audit des campagnes (une
      # modification documentaire est précisément ce qui casse les invariants de
      # miroir). Ces deux contrôles restent donc inconditionnels.
      - name: Périmètre du diff
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Base inconnue (première poussée d'une branche, historique tronqué) :
          # on ne devine pas, on traite le diff comme du code.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base '${base}' introuvable → périmètre traité comme code."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fichiers="$(git diff --name-only "$base" HEAD)"
          echo "Fichiers modifiés :"
          echo "$fichiers"
          # Volontairement PAS `grep -qv` : le grep BSD (macOS) en rend un statut
          # faux, ce qui rendrait cette logique invérifiable en local même si
          # elle passe sous le grep GNU du runner. On matérialise la liste.
          # Classés CODE bien que sous `docs/` : la matrice de mapping des
          # questionnaires, le REGISTRE DES INSTRUMENTS et le fichier de preuves
          # psychométriques (measurement_evidence.json). Ils font autorité et ne
          # sont vérifiés que par des étapes gatées : les classer « docs »
          # rendrait un `verify` vert sans qu'aucun contrôle ne tourne (deux
          # merges de l'historique ont cette forme). Récit complet :
          # docs/adr/2026-08-07-commentaires-workflows.md.
          hors_docs="$(printf '%s\n' "$fichiers" | grep -vE '(^docs/|\.md$)' || true)"
          mapping="$(printf '%s\n' "$fichiers" | grep -E '^docs/questionnaires-drive-mapping\.md$' || true)"
          registre="$(printf '%s\n' "$fichiers" | grep -E '^docs/claude/corpus/instrument_registry\.json$' || true)"
          preuves="$(printf '%s\n' "$fichiers" | grep -E '^docs/claude/corpus/measurement_evidence\.json$' || true)"
          if [ -z "$fichiers" ] || [ -n "$hors_docs" ] || [ -n "$mapping" ] || [ -n "$registre" ] || [ -n "$preuves" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Diff purement documentaire — étapes de build et E2E sautées."
          fi

      - name: Anti-secrets scan
        run: bash scripts/check_no_secrets.sh

      # Banc du contrôle ci-dessus : il prouve qu'il refuse ce qu'il annonce
      # refuser. Le 2026-07-27, ses motifs rataient une clé privée au format
      # JSON — `"private_key":`, guillemet fermant avant le séparateur — c'est
      # à dire la forme d'un compte de service Google. Il répondait « OK ».
      # Sans banc, un garde redevenu muet resterait vert. Ni npm ni build : le
      # banc n'a besoin que de bash, git et node.
      - name: Anti-secrets (banc du contrôle)
        run: node --test scripts/check_no_secrets.test.mjs

      # Les hooks de `.claude/` sont le mur d'écriture du dépôt : ils refusent
      # `.env*`, `.git/`, les commandes destructives et celles qui exposent un
      # secret. `CLAUDE.md` désigne `block-risky-commands.test.mjs` comme leur
      # banc — mais AUCUN workflow ne le jouait. Le mur n'avait donc pour filet
      # que les exécutions locales, alors que c'est exactement le motif du banc
      # anti-secrets ci-dessus : un garde redevenu muet reste vert.
      #
      # Le glob plutôt qu'un chemin en dur : un banc de hook ajouté demain est
      # joué sans toucher ce fichier, et si le fichier disparaît le glob reste
      # littéral et `node --test` échoue — la disparition est bruyante, pas
      # silencieuse comme le serait `node --test .claude/hooks/`.
      #
      # SANS le filtre `docs_only`, délibérément, et pour une raison plus forte
      # que les étapes voisines : `.claude/hooks/**` est du CODE de garde-fou,
      # jamais de la prose. Le classer un jour côté documentaire rejouerait ce
      # que le registre des instruments a déjà coûté — un fichier qui fait
      # autorité sur le chemin court, ses seuls contrôles gatés, `verify` vert.
      # Ni npm ni base : le banc n'a besoin que de node.
      - name: Hooks de garde-fous (banc du mur d'écriture)
        run: node --test .claude/hooks/*.test.mjs

      # L'étape « Dossier des droits (chiffres contre le registre) » a été
      # RETIRÉE le 2026-07-29, dans la PR qui applique l'arbitrage qu'elle
      # gardait. C'est la procédure que son banc décrivait lui-même : le dossier
      # est un instantané daté, le registre a bougé, le banc devait partir avec
      # sa raison d'être plutôt que d'être rafistolé pour rester vert.
      - name: Campaign rules audit (blocking)
        run: node scripts/wn-campaign-audit.mjs --fail-on-warning-codes missing_audit_root,missing_in_mirror,extra_in_mirror,status_drift_between_roots,closed_campaign_with_open_lots,inflight_without_active_lot,idle_with_active_fields

      # Une consigne impérative d'un skill vers un AUTRE skill ne vaut que si
      # la cible est exposée à l'outil `Skill`. `disable-model-invocation: true`
      # l'en retire : la consigne reste une prose valide qui désigne une
      # capacité absente, et rien ne la voit. Deux fois le cas ici — la consigne
      # de `CLAUDE.md` vers `wn-route`, puis les six branchements vers
      # `/wn-reprompt` (PR #529, verte de bout en bout).
      #
      # SANS le filtre `docs_only`, délibérément : une PR qui ne touche que des
      # `SKILL.md` est classée documentaire par l'étape « Périmètre du diff »
      # (tout finit en `.md`). La gater reviendrait à ne jamais l'exécuter sur
      # exactement les PR qu'elle vise. Ni npm ni build : node suffit.
      - name: Invocations croisées entre skills (blocking)
        run: node scripts/lib/skill-cross-invocation.mjs

      # Banc du contrôle ci-dessus. Il prouve qu'il épingle une consigne morte,
      # et surtout qu'il se tait sur les trois formes qui le feraient
      # débrancher : la mention en table d'un routeur, l'interdiction qui cite
      # le même verbe, et le drapeau cité en commentaire de frontmatter. Un
      # garde devenu permissif — ou bavard — resterait vert sans lui.
      - name: Invocations croisées entre skills (banc du contrôle)
        run: node --test scripts/lib/skill-cross-invocation.test.mjs

      # Un bloc `!` de skill qui désigne un chemin relatif à la RACINE n'est
      # exécutable que si la session tourne depuis la racine. Lancée depuis
      # `web/` — le cas courant — la même ligne échoue, ou pire se tait :
      # mesuré le 2026-08-03 sur les 32 blocs fautifs, **27 rendaient une sortie
      # VIDE avec un code de retour 0**, et 5 seulement échouaient bruyamment.
      # Le skill croyait avoir lu l'état du dépôt et planifiait sur du vide,
      # sans un message ni un code d'erreur.
      # Même absence de filtre `docs_only` que les deux étapes ci-dessus, et
      # pour la même raison. Ni npm ni build : node suffit.
      - name: 'Blocs `!` des skills ancrés à la racine (blocking)'
        run: node scripts/lib/skill-bang-cwd.mjs

      # Banc du contrôle ci-dessus. Il prouve qu'il attrape le cas silencieux,
      # et surtout qu'il se tait sur ce qui le ferait débrancher : les commandes
      # git sans chemin de racine, `--stat`/`--show-toplevel` qu'on ne doit pas
      # confondre avec un `--` de pathspec, et les chemins qui ne visent pas la
      # racine (`web/docs/…`).
      # Ce commentaire affirmait que « `git status --short` rend la même chose
      # depuis n'importe où » : c'est FAUX au pied de la lettre — lancé depuis
      # `web/`, il rapporte bien tout le dépôt, mais préfixe les chemins de
      # `../`. Le garde ne les épingle pas (aucun chemin de racine dans la
      # commande) ; les 20 blocs `!` de skills qui l'utilisaient ont pourtant
      # été ancrés le 2026-08-04, en même temps qu'ils recevaient
      # `--untracked-files=all` — sans quoi un répertoire entièrement non suivi
      # est collapsé en une ligne et un handoff neuf passe inaperçu.
      - name: 'Blocs `!` des skills ancrés à la racine (banc du contrôle)'
        run: node --test scripts/lib/skill-bang-cwd.test.mjs

      # Banc de `scripts/wn-cycle.mjs`, le verdict de phase chargé par le bloc
      # `!` de `/wn-finish` et `/wn-handoff`. Ce qu'il protège tient en un cas :
      # une PR mergée en squash SANS sa clôture doit sortir en échec, pas en
      # constat — sinon le skill écrit sur une branche dont plus rien ne remonte
      # vers `main`. Même absence de filtre `docs_only` que l'étape ci-dessus, et
      # pour la même raison. Ni npm ni build : node suffit.
      - name: Phase du cycle de lot (banc du verdict)
        run: node --test scripts/wn-cycle.test.mjs

      # Banc de `scripts/wn-attendre-ci.mjs`, le verdict qui décide si le CI
      # d'une PR a RÉELLEMENT tourné. Ce qu'il protège : l'idiome qu'il remplace
      # attendait que plus rien ne soit `pending` et rendait donc la main sur
      # deux checks Vercel verts quand `verify` n'avait jamais été créé — cas
      # rencontré sur la PR #550 le 2026-08-03. Les cas qui doivent tomber sont
      # ceux où un verdict vert serait faux : check absent, run gelé en
      # `action_required`, délai dépassé. Un garde qui rend 0 en expirant ne
      # prouve que sa propre patience. Même absence de filtre `docs_only` que
      # les étapes ci-dessus, et pour la même raison. Ni npm ni build : node
      # suffit.
      - name: Attente du CI d'une PR (banc du verdict)
        run: node --test scripts/wn-attendre-ci.test.mjs

      # `docs/DECISIONS.md` reste délibérément à créneau unique : une décision
      # se lit dans la suite des autres et huit renvois croisés pointent vers
      # des `D-NNN` précis. On ne supprime donc pas le conflit — on rend la
      # collision impossible à manquer. Deux branches parallèles qui posent
      # chacune leur décision en tête prennent le MÊME numéro : `D-013` le
      # 2026-08-03, `D-014` le 2026-08-04, huit renvois à renuméroter chaque
      # fois. Un conflit de merge est bruyant et se résout ; un doublon de
      # numéro est silencieux et se propage.
      # Même absence de filtre `docs_only` que les étapes ci-dessus, et pour la
      # même raison — le fichier gardé EST un `.md`. Ni npm ni build.
      - name: Numérotation du registre des décisions (blocking)
        run: node scripts/lib/decisions-numerotation.mjs

      # Banc du contrôle ci-dessus. Il prouve les trois morsures séparément —
      # doublon, trou, désordre — et le silence sur l'état réel du dépôt. Un
      # garde qui n'attrape qu'une des trois ressemblerait aux deux fois où la
      # collision est passée.
      - name: Numérotation du registre des décisions (banc du contrôle)
        run: node --test scripts/lib/decisions-numerotation.test.mjs

      # Invariants de sûreté de `release-db`, le seul chemin d'écriture de la base
      # de production. Depuis que ce workflow est proposé automatiquement, il ne
      # reste plus qu'UNE barrière entre un merge et une écriture : l'environnement
      # protégé. Un `environment:` retiré par mégarde était inoffensif tant que
      # personne ne déclenchait ; il ne l'est plus. Aucun lint de workflow ne tourne
      # ici, et une erreur dans ce fichier ne se révélerait qu'à l'exécution — avec
      # une migration en attente.
      - name: Invariants du workflow release-db
        run: node --test scripts/release-db-invariants.test.mjs

      # L'autre moitié du protocole : les invariants ci-dessus verrouillent ce
      # que le workflow LIT (sentinelles liées au run, jeton borné), ce banc
      # joue ce que les scripts ÉMETTENT — en bash réel, npx factice, chaque
      # point de sortie — plus la porte du postdeploy (D-087). Un protocole
      # vérifié d'un seul côté n'est qu'une convention.
      - name: Scripts de release Scalingo (banc des sentinelles)
        run: node --test scripts/release-db-scripts.test.mjs

      # Banc de `scripts/changelog-collate.mjs`, qui replie les fragments de
      # `changelog.d/` dans `CHANGELOG.md`. Il ne tournait NULLE PART : ni en
      # CI, ni dans `npm run check`. Un banc qu'aucune passe n'exécute ne
      # protège de rien — c'est la même classe de défaut que le lint hors du
      # palier T1. Ni npm ni build : node suffit.
      - name: Repli des fragments de changelog (banc du script)
        run: node --test scripts/changelog-collate.test.mjs

      # Banc de `scripts/wn-campaign.mjs`, qui tient `.wn/state.json` et
      # régénère `ACTIVE_CAMPAIGN.md`. Même motif que ci-dessus : il existait
      # sans jamais être exécuté, alors que `wn-cycle.mjs --appliquer` appelle
      # `wn-campaign.mjs sync` pour resynchroniser la vue humaine.
      - name: État de campagne et vue humaine (banc du script)
        run: node --test scripts/wn-campaign.test.mjs

      # Les deux bancs de `scripts/wn-etat-reel.mjs` : l'observation des six
      # dimensions, et les trois gardes de cohérence qui en confrontent trois
      # (vue `ACTIVE_CAMPAIGN.md` contre `.wn/state.json`, cohérence des deux
      # dates de l'état, lot courant contre `CAMPAGNE.md`). C'est ICI qu'ils
      # deviennent opposables : `wn-attendre-ci.mjs` est le seul verdict que le
      # dépôt accepte, et un garde qui ne tourne qu'en T1 dépend de la
      # discipline de la session qui l'oublie. Les deux fichiers étaient dans
      # `npm run check` sans être dans ce workflow — trou trouvé par la revue
      # adversariale du 2026-08-08, que `parite-check-ci` ne pouvait pas voir
      # (elle vérifie CI → `check`, jamais l'inverse).
      #
      # NE PAS exporter `GH_TOKEN`/`GITHUB_TOKEN` sur cette étape. Le banc de
      # `wn-etat-reel` compare deux exécutions du script et exige des rapports
      # identiques ; le rapport contient `gh pr list`. Sans authentification,
      # `gh` échoue à l'identique et la comparaison est stable — avec un jeton,
      # elle deviendrait une égalité entre deux instantanés d'API pris à une
      # seconde d'intervalle, et flaquerait sur des PR sans rapport.
      - name: État réel du dépôt et gardes de cohérence (bancs des scripts)
        run: node --test scripts/wn-etat-reel.test.mjs scripts/wn-coherence-etat.test.mjs

      # Banc de `scripts/wn-matrice-consommation.mjs`, qui dérive du code la
      # matrice « source de savoir → surface qui la consomme ». Le garde utile
      # n'est pas « le script tourne » : c'est qu'une source SANS appelant
      # apparaisse avec une surface vide au lieu d'être omise, et que toute
      # source dormante porte un arbitrage daté dans
      # `docs/claude/corpus/consommation_decisions.json`. Une source qui
      # s'endort sans décision fait donc rougir ce banc — la dette se voit le
      # jour où elle naît, pas six semaines plus tard.
      - name: Matrice de consommation du savoir (banc du générateur)
        run: node --test scripts/wn-matrice-consommation.test.mjs

      # La passe Vitest en position ÉTEINTE (plus bas) ne joue plus la suite
      # entière depuis le 2026-08-07, mais la liste de `test:court14`
      # (web/package.json). Une liste écrite à la main dérive au premier spec
      # ajouté ; ce banc DÉRIVE les candidats du code — marqueurs statiques de
      # dépendance au drapeau — et exige que chacun soit dans la liste, ou dans
      # une allowlist motivée. Il garde aussi que `test:siin57`, la position de
      # PRODUCTION, reste une passe complète. Ni npm ni build : node suffit.
      - name: Specs dépendant du drapeau Q_ALI_01 (banc anti-dérive)
        run: node --test scripts/specs-drapeau-ali01.test.mjs

      # La version de consigne écrite dans les DOCUMENTS OPPOSABLES doit être
      # celle qui est livrée. Le couple version/empreinte est déjà verrouillé
      # dans le code ; rien ne le reliait au registre ni aux fragments. Le
      # 2026-08-12, la consigne a été reprise quatre fois dans un même lot et la
      # citation documentaire est restée derrière trois fois de suite, chaque
      # fois relevée en revue. Une règle oubliée deux fois devient exécutable.
      - name: Version de consigne — code, registre et changelog d'accord
        run: node --test scripts/version-prompt-documents.test.mjs

      # Invariants de ce fichier même. Le bloc `concurrency` ci-dessus porte une
      # règle qu'un commentaire ne suffit pas à tenir : sur `main`, deux runs ne
      # doivent JAMAIS partager un groupe, sans quoi GitHub annule le run pending
      # intermédiaire et un commit fusionné perd sa seule vérification.
      - name: Invariants de ci.yml (déclencheurs, concurrency)
        run: node --test scripts/ci-invariants.test.mjs

      # Le classement d'un échec E2E (blocage navigateur vs défaut applicatif)
      # ne sert qu'en local — `wn-test-worktree.sh` ne tourne pas ici. Son BANC,
      # lui, a sa place dans les deux passes : le banc de parité ne contrôle que
      # le sens CI → `check`, donc un banc ajouté à `check` seul ne serait
      # rattrapé par rien. Ni npm ni build : node suffit.
      - name: Diagnostic d'un échec E2E (banc du classement)
        run: node --test scripts/wn-diagnostic-e2e.test.mjs

      # Parité entre ce job et `npm run check`. Toutes les étapes ci-dessus sont
      # bloquantes et ne demandent que node, git et bash : aucune raison qu'un
      # développeur les découvre en CI. C'est la leçon du lint (2026-07-21),
      # revenue à l'identique le 2026-08-04 quand sept bancs ont été câblés ici
      # et laissés hors de `check`. Ce banc échoue dès qu'une étape bloquante du
      # CI manque à `check` — y compris lui-même. L'inverse n'est pas contrôlé,
      # et n'a pas à l'être : `check` fait légitimement plus (lint, type-check,
      # Vitest).
      - name: Parité `npm run check` / CI (banc de la liste)
        run: node --test scripts/parite-check-ci.test.mjs

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm ci

      # Protège la logique clinique : les 63 questionnaires doivent rester
      # conformes à leurs fixtures de scoring certifiées. Après `npm ci` : le
      # juge transpile le TypeScript du catalogue (devDependency de web/).
      # Une PR purement documentaire ne peut pas l'esquiver pour autant : la
      # matrice de mapping est classée code par l'étape « Périmètre du diff ».
      # Lancé DEUX FOIS, une par position de `WN_ALI_01_SIIN57`. `Q_ALI_01` a
      # deux formes servies (dépistage court à 14 items, Enquête SIIN à 57) et
      # le catalogue n'en expose qu'une à la fois : en ne jouant que la position
      # par défaut, le garde était aveugle à la forme gatée — vert au merge,
      # rouge à la bascule du drapeau, c'est-à-dire au pire moment.
      - name: Scoring certification (63 questionnaires, blocking)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          node scripts/check_questionnaire_certification.js
          WN_ALI_01_SIIN57=true node scripts/check_questionnaire_certification.js

      # Banc du validateur de registre : c'est lui qui prouve que le garde
      # ci-dessus échoue quand il doit échouer (entrée manquante, axe hors
      # vocabulaire, extraction BESOIN_SOURCES cassée). Sans ce banc, un garde
      # devenu muet resterait vert.
      - name: Registre des instruments (banc du validateur)
        if: steps.scope.outputs.docs_only != 'true'
        run: node --test scripts/lib/verifier_registre_instruments.test.mjs

      # Même raison pour le comparateur SOURCE ↔ SERVI du banc de
      # certification : ses cas prouvent qu'il détecte une échelle décalée, une
      # inversion absente ou partielle, un barème sans source — et qu'il se
      # tait quand l'inversion est portée par la clé de réponse. Un
      # comparateur permissif certifierait n'importe quoi en silence.
      #
      # TOUS les bancs de `lib/`, et non un fichier nommé :
      # `troncature.test.mjs`, posé le 2026-08-01, n'aurait jamais tourné ici
      # sans qu'on y repense. Un banc qu'il faut penser à brancher finit par ne
      # pas l'être.
      #
      # Le script, et pas un motif écrit ici : un motif sans correspondance rend
      # `# tests 0` avec un code de retour 0 sous bash comme sous sh. Le script
      # refuse explicitement d'être vert sur zéro banc.
      - name: Bancs du banc de certification (comparateur, gardes de troncature)
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/run-certify-bancs.sh

      # Résolution des compositions Compl'Alim vers le référentiel. Le libellé
      # n'atteint jamais le serveur — c'est l'outil qui lit le CSV, résout, et
      # n'envoie que des identifiants officiels — donc cette logique clinique
      # vit hors de Vitest et doit être branchée ici pour tourner.
      #
      # Ce que ses cas verrouillent : « Huile de poisson » rend UN actif et non
      # les sept constituants dont elle est la forme d'apport ; une forme à deux
      # parents (« D-pantothénate de calcium » → calcium ET vitamine B5) n'est
      # pas écrite mais rapportée ; une ligne « plantes » ne s'accroche jamais à
      # une substance ; aucune unité n'est devinée. Le banc relit aussi
      # `SUPPLEMENTS_UNITES` dans config.ts et refuse une recopie divergente.
      #
      # `transporter.test.mjs` est câblé ICI ET DANS `npm run check` (script
      # `compositions-check`), jamais dans un seul des deux : il porte
      # l'anti-dérive de `TAILLE_LOT_MAX` / `LIGNES_MAX_PAR_LOT` contre les
      # constantes du serveur, la preuve que le dry-run n'ouvre aucune
      # connexion, et la garde deux clés sur la cible d'envoi. Livré hors de
      # tout runner, il n'aurait gardé rien du tout.
      - name: Résolution et transport des compositions (bancs)
        if: steps.scope.outputs.docs_only != 'true'
        run: node --test tools/supplements/compositions/lib/resolution.test.mjs tools/supplements/compositions/transporter.test.mjs

      # Banc golden de scoring : verrouille calculateScore/buildMiniSynthese
      # contre quatre fixtures représentatives + un cas d'erreur. Débranché de
      # tout runner jusqu'ici — son chargeur (concaténation des sources TS de
      # questions.ts et exécution via `new Function`) cassait sur une syntaxe
      # de type trop récente pour son ancien strip par regex. Une dérive
      # réelle du fixture (protocol → conduite, PR #389) s'y était accumulée
      # sans qu'aucun run ne s'en aperçoive — exactement ce que le brancher ici
      # referme. Après `npm ci` : son chargeur transpile le TS via le
      # compilateur, devDependency de web/.
      - name: Scoring golden bench (banc de régression)
        if: steps.scope.outputs.docs_only != 'true'
        run: node --test tests/wellneuro/golden/scoring-golden.test.mjs

      - name: Generate Prisma client
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma generate

      - name: Setup database schema
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma migrate deploy

      # Gate avant déploiement : en production, seul le SQL des migrations
      # committées est appliqué (workflow release-db). Si schema.prisma
      # a évolué sans migration, le client Prisma déployé attendrait un schéma
      # que la base n'aura jamais. La base CI vient d'être construite uniquement
      # par `migrate deploy` : l'introspecter (--from-config-datasource lit
      # DATABASE_URL) équivaut à rejouer les migrations. Échec (code 2) si elle
      # diverge de schema.prisma.
      - name: Migration drift check (schema.prisma vs migrations)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: C5 LOT-02 migration contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/c5_ciqual_reference_v1.sql

      - name: RAG claim decisions journal contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_claim_decisions_journal_v1.sql

      # L'index unique partiel des assignations vit en SQL brut : Prisma ne sait
      # pas le déclarer, donc le drift check ne le voit pas. Sans ce contrat, sa
      # disparition ne rougirait nulle part.
      - name: Assignations unicité ouverte contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/assignations_unicite_ouverte_v1.sql

      # `D-114` — forme du jalon et identité de cycle sur `assessment_episodes`.
      # Un CHECK et deux index PARTIELS, que Prisma ne sait pas déclarer : le
      # drift check ne les voit pas, donc leur disparition ne rougirait nulle
      # part sans ce contrat. Il éprouve aussi sa propre limite (`cycle_id`
      # NULL), pour qu'on ne croie jamais la garde plus large qu'elle n'est.
      - name: Episodes identite cycle contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/episodes_identite_cycle_v1.sql

      # LOT-03, dette 4 — cohérence `packs.qids` ↔ miroir relationnel. LA BASE
      # DU CI EST VIDE (construite par `migrate deploy` seul) : les assertions
      # du contrat y sont VACUES et n'y prouvent rien de la cohérence. Elles y
      # prouvent que le fichier parse, et rien d'autre. Ce qui éprouve qu'il
      # MORD est le fichier négatif juste en dessous, qui pose lui-même ses
      # fixtures. Le contrat ne voit la vraie dérive qu'en préflight de
      # `release-db.yml`, contre la production.
      - name: Packs ↔ registre relationnel contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/packs_registre_coherence_v1.sql

      # Huit formes de dérive doivent lever, quatre états sains doivent passer —
      # dont le pack SANS miroir, c'est-à-dire tout pack neuf entre sa création
      # et sa première synchro. Ce fichier ÉCRIT (fixtures annulées en fin de
      # transaction) : il ne doit jamais être câblé dans `release-db.yml`.
      - name: Packs ↔ registre relationnel contract (négatif)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/packs_registre_coherence_v1_negatif.sql

      # Le garde de contenu de la voie rapide tient à un motif d'expression
      # régulière : « rappel 55/55, précision 65 % » est une mesure faite une
      # fois en production. Ce banc l'épingle sur trente-sept cas — les textes
      # réels des 55 claims trouvés par l'audit, plus des sondes qui rendent
      # chaque famille de motifs individuellement indispensable. Sans lui, une
      # alternative supprimée par mégarde rouvrirait la signature par lot à des
      # plages de référence sans qu'aucun autre test ne bronche.
      - name: RAG claim seuils guard contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_claim_garde_seuils_v1.sql

      # La migration de reprise (20260728090000) écrit des données de production
      # — elle efface des signatures praticien. Sur la base du CI, construite
      # vide, elle est un no-op : sans ce banc, le CI n'en prouverait rien. Il
      # éprouve la fonction de cible sur les deux formes qui avaient échappé à
      # la première rédaction — un claim couvert par deux lots et tiré dans un
      # seul, et un claim revalidé individuellement après la signature de lot.
      - name: RAG claim reprise bornes contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_claim_reprise_bornes_v1.sql

      # Le marquage `usage = orientation` (20260801200000) écrit lui aussi des
      # données de production, et il est tout aussi invisible sur la base vide
      # du CI. Ce banc éprouve la fonction de périmètre sur ce qui porte une
      # décision clinique — la perfusion exclue, la quarantaine qui exclut même
      # un domaine réintégré par la décision f — et sur les deux propriétés que
      # le marquage doit tenir : idempotence, et refus d'écraser un usage
      # existant.
      - name: RAG claim usage orientation contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_claim_usage_orientation_v1.sql

      # La barrière D-003 (aucun claim non signé ne sort du corpus RAG) tient
      # à match_wellneuro_rag_claims (20260722150000) : ce banc éprouve ses
      # cinq conditions par fixture (contrôle positif A, puis B/C/D/E qui
      # doivent chacun échouer isolément), et assère structurellement les deux
      # CHECK qu'aucune fixture ne peut violer sans échouer à l'INSERT.
      - name: RAG claim barrière D-003 contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_claim_barriere_d003_v1.sql

      # Le rayon corpus filtre PAR NOTEBOOK (rayonCorpus.ts, décision 7 des
      # arbitrages 2026-07-27) : ce contrat éprouve que le notebook d'une source
      # est un fait univoque et présent en base. Sur la base CI (vide) il passe
      # trivialement ; sa fixture annulée prouve que le détecteur d'orphelin
      # n'est pas un no-op. Sa portée réelle est la prod (SELECT rejoués en
      # lecture seule post-merge) : la moitié « registre » de la garde de
      # divergence est tenue au runtime (sourcesDuNotebook lit le registre).
      - name: RAG rayon notebook coherence contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_rayon_notebook_coherence_v1.sql

      # Le socle pgvector vit en SQL brut, invisible du drift check : extension
      # `vector`, deux index HNSW cosinus, signatures des deux match_*. Un index
      # perdu ou invalide dégraderait la recherche RAG en scan séquentiel sans
      # qu'aucune suite ne rougisse ; un CREATE OR REPLACE oubliant le REVOKE
      # rouvrirait EXECUTE à PUBLIC (leçon de 20260721230000). Lecture seule —
      # le même fichier est rejoué en préflight de release-db.yml, contre la
      # production, où un drop manuel serait la seule origine possible.
      - name: RAG pgvector structure contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_pgvector_structure_v1.sql

      # LOT-01 chaîne T0 (D-042/D-044) — fraîcheur des claims épinglés par les
      # tables de règles SIGNÉES. SEUL LE FICHIER NÉGATIF EST CÂBLÉ ICI, et ce
      # n'est pas un oubli : le contrat positif cite 24 claims de production que
      # la base du CI, construite vide par `migrate deploy`, ne porte pas — il y
      # rougirait à chaque exécution. Sa place est le préflight de
      # `release-db.yml`, contre un corpus réel. Le fichier négatif pose ses
      # propres fixtures (transaction annulée), porte le MÊME prédicat au
      # caractère près, et prouve les SEPT formes de rupture — dont la version
      # divergente, qui tue le prédicat écrit sur `claim_id` seul, et N7, qui
      # borne l'exemption de D-046 en éprouvant que la ligne des contradictions
      # reste gardée sur les trois autres propriétés. Sans lui,
      # « contrat vert » ne prouverait rien : c'est le piège de D-012/D-015.
      - name: RAG claims épinglés — fraîcheur des tables signées (négatif)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/rag_claim_fraicheur_tables_signees_v1_negatif.sql

      # C4 — provenance du référentiel d'ingrédients : nullabilité APPARIÉE de
      # (source_provenance, source_identifiant), et index côté FORME délibérément
      # NON unique. Récit : docs/adr/2026-08-07-commentaires-workflows.md.
      - name: C4 référentiel provenance contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/c4_referentiel_provenance_v1.sql

      # C4 — structure du catalogue produits et de leurs compositions. Inerte
      # depuis le LOT-01 ; c'est la table de ce lot qu'il garde. Il vérifie
      # notamment l'index partiel `..._produit_ingredient_sans_forme`, sans
      # lequel PostgreSQL laisserait réinsérer sans fin un couple
      # (produit, ingrédient) sans forme — deux NULL n'entrant jamais en
      # conflit — et l'absence de colonne produit dans `clinical_rules`, qui
      # est la frontière entre le vocabulaire et le jugement.
      - name: C4 supplement catalogue contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/c4_supplement_catalogue_v1.sql

      - name: CB-01 biology structure contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_biologie_structure_v1.sql

      # Le contrat de DONNÉES (pointeur de version, snapshot, incompatibilités,
      # barrière D-003). Sur la base CI, VIDE, ses invariants renvoient 0 par
      # vacuité : il ne mord que là où des données existent.
      - name: CB-01 biology catalogue data contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_biologie_catalogue_v1.sql

      # Catalogue niveau 1 (D-068) : comptes 47/15/78 conditionnels, espaces de
      # codes analytes∩ratios disjoints, égalité des trois vocabulaires
      # d'unités, plages = claims fondateurs présents. Vacué à vide, mord dès
      # que le catalogue existe.
      - name: D-068 level-1 catalogue data contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_catalogue_niveau_1_donnees.sql

      # Le contrat structurel ci-dessus vérifie que les invariants sont EN PLACE ;
      # celui-ci vérifie qu'ils MORDENT — insertions interdites qui doivent toutes
      # être rejetées, et pour le bon motif. Transaction annulée : rien ne survit,
      # pas même la colonne ajoutée pour éprouver le verrou HDS.
      #
      # PORTÉE RÉELLE, À NE PAS SURESTIMER : ces fichiers tournent sur une base
      # construite par le seul `migrate deploy`, donc VIDE. Ils éprouvent la
      # STRUCTURE (CHECK, RLS, index, verrou HDS) ; les invariants de DONNÉES
      # renvoient 0 par vacuité. Ces derniers ne mordent que sur des données
      # réelles : la relecture et le contrat structurel sont rejoués DANS la
      # transaction de l'import CB-02a (`prisma/importNabm.ts`), et le banc CB-02a
      # en fait autant sur ses fixtures — y compris le cas d'une violation
      # structurelle qui doit annuler l'import (ROLLBACK).
      - name: CB-01 biology catalogue negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_biologie_catalogue_v1_negatif.sql

      # Arbitrage biologique sans valeurs (LOT-06, D-059 §4) : les trois CHECK
      # de `arbitrages_biologiques` doivent MORDRE (verdict borné, note
      # obligatoire non vide sur « infirme », note ≤ 2000), et la table ne doit
      # porter aucune colonne de valeur d'analyse. Transaction annulée.
      - name: CB arbitrage biologique negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_arbitrage_biologique_v1_negatif.sql

      # Panels documentés hors outil (LOT-06, D-071). Contrat à sept termes, et
      # chacun a été TUÉ PAR MUTATION avant d'être retenu : une déclaration
      # valide doit être ACCEPTÉE (sans ce cas positif, un CHECK devenu trop
      # serré passerait vert et la route casserait en production) ; un doublon
      # (patient, panel) doit lever 23505 — l'unicité RÉELLE, pas un index qui
      # porte le bon nom, sans quoi le statut d'un panel dépendrait de l'ordre
      # de lecture ; les deux CHECK sur l'auteur doivent mordre ; la table doit
      # porter EXACTEMENT sept colonnes (liste blanche : un motif ne verrait
      # pas passer un `commentaire` ou un `payload`, chemins les moins coûteux
      # pour ranger un résultat d'analyse) ; les deux clés étrangères doivent
      # être en ON DELETE RESTRICT, invisible du drift check ; la RLS deny-all
      # doit être active et sans policy. Fixtures posées et transaction annulée.
      - name: CB panels documentés negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_panels_documentes_v1_negatif.sql

      # Constats de critères sur un dossier (D-138). Ce qui rend un critère vrai
      # chez un patient n'est écrit nulle part dans le dépôt : il ne se dérive
      # donc pas, il se CONSTATE, signé. Contrat à neuf termes : un constat
      # valide accepté ; un second constat CONTRADICTOIRE sur le même (patient,
      # critère) rejeté en 23505 — sans quoi le verdict d'une règle clinique
      # dépendrait de l'ordre de lecture ; les CHECK signataire et note qui
      # mordent ; huit colonnes exactes en liste blanche (aucune valeur, aucun
      # score) ; `present` NOT NULL, verrou DC-24 — un NULL y serait un
      # troisième état muet, indiscernable de « constaté absent », alors que
      # l'inconnu doit s'exprimer par l'ABSENCE de ligne ; les deux FK en ON
      # DELETE RESTRICT, invisibles du drift check ; la RLS deny-all sans
      # policy ; et la FK de `clinical_rules` vers le vocabulaire, qui est la
      # moitié « séparation » de la migration. Transaction annulée.
      - name: CB critères dossier negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_criteres_dossier_v1_negatif.sql

      # Claim fondateur d'une règle clinique (D-140). Le moteur vérifie
      # `claimsValides` EN PREMIER, et `clinical_rules` n'avait aucun champ pour
      # nommer un claim : toute règle était refusée, avec un motif qui affirmait
      # faussement que « les claims cités » n'étaient pas valides. Ce contrat
      # éprouve ce que la base garde seule : une référence bien formée acceptée
      # (cas positif), un `claim_id` ou une `version_claim` hors format rejetés
      # (formats RECOPIÉS de `rag_corpus_claims`), une référence dépareillée
      # rejetée — le couple est ce qui est UNIQUE là-bas, un membre seul ne
      # désigne rien —, les deux colonnes encore NULLABLES (c'est l'expand d'un
      # expand/contract, et l'oubli du contract ne doit pas passer inaperçu), et
      # l'index de lecture par claim. Il ne garde PAS que le claim existe et soit
      # VALIDE : aucune FK n'est possible vers une table SQL-brut, cette
      # vérification appartient à la route et au lecteur de catalogue.
      - name: C4 règle/claim negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/c4_regle_claim_v1_negatif.sql

      # Document patient biologie (décision F, D-122) : un document valide et
      # une seconde génération doivent être ACCEPTÉS (append-only) ; les CHECK
      # doivent MORDRE (texte vide ou blancs avec tabulations — trou btrim/1
      # fermé —, ancre hors format sha256 minuscule, version vide, auteur
      # vide/espaces/trop long) ; la table porte EXACTEMENT huit colonnes
      # (liste blanche : aucune colonne de valeur d'analyse) ; cinq porteuses
      # NOT NULL ; FK patients en ON DELETE RESTRICT ; RLS deny-all active et
      # sans policy. Fixtures posées et transaction annulée.
      - name: CB document patient negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_documents_patient_v1_negatif.sql

      - name: CB resultats biologiques negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/cb_resultats_biologiques_v1_negatif.sql

      # Sélection praticien d'une priorité (D-127) : une sélection valide est
      # ACCEPTÉE et une correction CHAÎNÉE aussi ; deux RACINES sur la même
      # carte sont refusées, et deux SUCCESSEURS de la même ligne également —
      # le fil d'une carte est strictement linéaire, la fourche n'est pas
      # représentable (deux sélections concurrentes, ce seraient deux
      # praticiens croyant chacun avoir décidé). Les CHECK doivent MORDRE
      # (motif vide/blanc/trop long, candidat vide, auteur vide ou trop long,
      # empreinte de carte hors SHA-256 canonique, ligne qui se supplante
      # elle-même) ; dix colonnes exactes en liste blanche ; six colonnes
      # porteuses NOT NULL ; FK patients en ON DELETE RESTRICT ; RLS deny-all
      # active et sans policy ; et la FORME des deux index, qu'un `@@unique`
      # redéclaré au schéma rendrait totaux sans faire rougir la dérive.
      - name: C1 selection priorite negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/c1_selection_priorite_v1_negatif.sql

      # Dossier à deux voix (Alliance 6.0-A LOT-01) : une écriture valide par
      # table doit être ACCEPTÉE ; les CHECK doivent MORDRE (praticien
      # vide/espaces/trop long, textes porteurs vides, `sens` hors taxonomie) ;
      # chaque table porte EXACTEMENT ses colonnes (liste blanche — l'arme de
      # l'interdit « aucun score, seuil ou bande », DC-19/DC-20 : un motif ne verrait
      # pas passer un `payload` ou un `niveau`) ; colonnes porteuses NOT NULL ;
      # cinq FK vers patients en ON DELETE RESTRICT (en CASCADE, la
      # suppression nommée d'effacement.ts deviendrait du code mort) ; RLS
      # deny-all active et sans policy sur les cinq. Fixtures posées et
      # transaction annulée.
      - name: Alliance dossier à deux voix negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/alli_dossier_deux_voix_v1_negatif.sql

      # Objectif à trois voix (Alliance 6.0-B LOT-01, D-094) : mêmes exigences
      # que ci-dessus sur les trois tables neuves, PLUS ce qui est propre à ce
      # lot — `fragments` doit être un tableau NON VIDE (une proposition sans
      # citation n'en est pas une, c'est l'invariant de D-094 au niveau le plus
      # bas) ; le couple GESTE↔MOTIF mord DANS LES DEUX SENS (écart sans motif
      # refusé, reprise avec motif refusée : le motif d'écart est le matériau
      # du LOT-06, et la reprise se lit dans l'objectif produit) ; les six
      # CHECK sont assertés PAR LEUR NOM et la taxonomie `geste` lue dans sa
      # DÉFINITION — le CHECK du couple subsume celui de la taxonomie, si
      # bien qu'aucun cas négatif ne peut isoler ce dernier : sans assertion
      # structurelle, on pouvait légaliser « caduque » comme geste (une
      # décision que nul n'a prise) sans qu'une ligne du CI ne parle ;
      # `motif` reste NULLABLE et `source_proposition_id` NULLABLE SANS DEFAULT
      # (un DEFAULT fabriquerait un lien que personne n'a posé). La liste
      # blanche vise ici aussi le RANG : D-094 §3 interdit jusqu'à la
      # numérotation, l'ordre des candidats n'étant couvert par aucune ligne
      # signée. Fixtures posées et transaction annulée.
      - name: Alliance objectif à trois voix negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/alli_objectif_trois_voix_v1_negatif.sql

      # Réponses d'étape aux jalons (Alliance 6.0-B LOT-05) : mêmes exigences de
      # forme sur la table neuve, PLUS ce qui lui est propre — `T0` EST REFUSÉ
      # COMME JALON, nommément (c'est l'ANCRE des fenêtres, pas une étape :
      # demander « où en êtes-vous » au moment où l'objectif se pose n'a pas de
      # sens), et `J7` l'est aussi (taxonomie de `protocol_checkins`, pas la
      # nôtre), et un texte fait de blancs NON-ESPACE est refusé — `btrim/1` ne
      # retire que l'espace ASCII, si bien qu'une tabulation passait la première
      # rédaction du CHECK. La taxonomie est lue dans sa DÉFINITION : les cas négatifs
      # testent des valeurs REFUSÉES, si bien qu'un CHECK ÉLARGI à `T0` les
      # laisserait tous verts. L'EVA est bornée 0-10 par une borne PUREMENT
      # TECHNIQUE de saisie (DC-19/DC-20) — aucune bande, aucun seuil, aucune
      # direction, aucune moyenne —, et elle reste NULLABLE : la rendre
      # obligatoire forcerait un chiffre là où le patient n'a que des mots.
      # AUCUNE contrainte d'unicité n'est admise sur (patient, objectif, jalon) :
      # répondre deux fois fait DEUX lignes, un UNIQUE pousserait à l'upsert,
      # c'est-à-dire à écraser ce que le patient avait écrit. Liste blanche de
      # colonnes visant ici le TAUX D'ATTEINTE autant que le score. Fixtures
      # posées et transaction annulée.
      - name: Alliance jalons objectif negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/alli_jalons_objectif_v1_negatif.sql

      # Ancrage de provenance des correspondances médecin (LOT-06, D-073) : les
      # deux CHECK doivent MORDRE — SHA sans version, version sans SHA, SHA de
      # longueur invalide —, une ancre COMPLÈTE doit passer, et une
      # correspondance SANS ancre aussi (une lettre saisie à la main n'est
      # dérivée d'aucune table : lui en inventer une serait pire que l'absence).
      # Transaction annulée.
      - name: C3 ancrage correspondance médecin negative tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/c3_correspondance_ancrage_v1_negatif.sql

      # Agenda alimentaire (Q_ALI_09) : AUCUN index unique sur
      # (id_assignation, date_jour) — assertion inversée, délibérée — et ses
      # invariants de DONNÉES sont vacués sur la base CI, vide. Récit :
      # docs/adr/2026-08-07-commentaires-workflows.md.
      - name: Agenda alimentaire contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/agenda_alimentaire_v1.sql

      # Les contrats ci-dessus éprouvent la STRUCTURE ; ce banc éprouve le
      # CHEMIN D'ÉCRITURE de l'import CB-02a, que les tests Vitest ne touchent
      # pas (ils couvrent la logique pure). Il rejoue une rotation de millésime
      # sur fixtures : c'est le seul contexte où se manifeste le défaut trouvé
      # en revue — un pointeur qui change de millésime servi sans le dire.
      - name: CB-02a NABM import bench
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        env:
          WN_CB_NABM_DESTRUCTIVE_TEST: wellneuro_ci
        run: bash scripts/test-cb-nabm-import.sh

      - name: C5 LOT-02 import contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        env:
          WN_C5_CIQUAL_DESTRUCTIVE_TEST: wellneuro_ci
        run: npm run c5:ciqual:test-integration

      - name: Seed test data
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run prisma:seed

      # LE MÊME CONTRAT, MAIS SUR UNE BASE PEUPLÉE — et c'est ici seulement qu'il
      # prouve quelque chose. Joué plus haut, il porte sur une base vide : ses
      # assertions y sont vacues. Le seed écrit désormais le miroir du pack de
      # base (LOT-03) : il est donc le seul écrivain de miroir hors
      # `syncPackToRegistry`, et cette étape est ce qui le tient.
      #
      # Elle n'est pas théorique : la première rédaction du seed miroitait la
      # CONSTANTE `PACK_BASE.qids` au lieu de la ligne en base, ce qui
      # fabriquait la dérive du 2026-08-05 dès que les deux divergeaient. Cette
      # étape l'aurait attrapée seule.
      - name: Packs ↔ registre relationnel contract (après seed)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/packs_registre_coherence_v1.sql

      # LOT-03 « Biologie consolidée » — le FRÈRE du contrat ci-dessus, jamais
      # son doublon : deux représentations d'accord peuvent être toutes deux
      # fausses, un pack parfaitement miroité peut référencer un instrument
      # suspendu (incident du 2026-08-06, `Q_ALI_09` au pack de base). Joué
      # APRÈS le seed pour évaluer des lignes réelles ; la suspension se lit en
      # base (`questionnaires.actif`), jamais dans une liste recopiée.
      - name: Packs actifs sans instrument suspendu contract
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx prisma db execute --file prisma/checks/packs_instruments_suspendus_v1.sql

      - name: Type-check
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee typecheck.log

      # Le log complet du type-check est conservé en artefact : le tronquage
      # des annotations GitHub masquait des erreurs TS sur les gros diffs.
      - name: Upload type-check diagnostics
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: web/typecheck.log
          if-no-files-found: ignore
          retention-days: 7

      # Position ÉTEINTE du drapeau — celle que la PRODUCTION n'utilise pas
      # (`WN_ALI_01_SIIN57` y est allumé sur les trois environnements depuis le
      # 2026-07-28). Depuis le 2026-08-07 elle ne joue donc plus les 370 fichiers
      # mais les seuls specs dont le verdict dépend de la position du drapeau :
      # les 352 autres rendraient le même verdict qu'en position allumée, où la
      # suite entière tourne juste en dessous. Liste dans `test:court14`
      # (web/package.json), gardée par `scripts/specs-drapeau-ali01.test.mjs`.
      - name: Unit tests (Vitest, forme courte 14 items)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run test:court14

      # Seconde passe, drapeau `WN_ALI_01_SIIN57` allumé. Sans elle, les gardes
      # qui dérivent une valeur du barème servi (le `max` du besoin 1,
      # l'étiquette de version) ne mordent que dans une position : figer `max` à
      # 42 et la version à sa valeur courante passe inaperçu en position
      # éteinte, où le dérivé vaut justement la valeur figée. Falsifié : ces
      # deux mutations ne faisaient tomber aucun test avant cette étape.
      # C'est ELLE qui reste la passe complète : le drapeau est allumé en
      # production, donc la suite entière doit tourner dans cette position-là.
      # Restreindre celle-ci plutôt que la précédente aurait réduit la couverture
      # de la configuration RÉELLE à quelques specs — l'inverse de ce qu'on veut.
      - name: Unit tests (Vitest, forme SIIN 57 items)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run test:siin57

      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run lint

      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        # Les drapeaux du rayon biologie sont exigés ICI, au BUILD, et pas
        # seulement au démarrage du serveur : `dashboard/patients/[idPatient]`
        # lit `process.env.WN_CB_ENABLED` dans un COMPOSANT SERVEUR pour
        # alimenter `CbFeatureProvider`. Sans eux à la construction, la valeur
        # `false` est cuite dans la page, le client ne demande jamais la
        # proposition, et le panneau reste absent — alors même que la route
        # d'API, dynamique, répond `ok` au runtime. C'est exactement le
        # symptôme observé au CI du 2026-08-21 : sonde verte, écran vide.
        #
        # Portée volontairement limitée à cette étape et à `webServer.env` :
        # au niveau du job, ces mêmes drapeaux déplacent la position de la
        # suite Vitest et font rougir dix bancs.
        #
        # Les trois drapeaux de l'alliance obéissent au même mécanisme : les
        # pages `portail/[token]/{ce-qui-compte,comprehension,dossier}` lisent
        # le leur au RENDU SERVEUR et rendent `notFound()` s'il est éteint —
        # sans eux au build, les trois écrans sont introuvables et le parcours
        # du dossier à deux voix n'a rien à ouvrir. Ils ne sont pas posés en
        # production : ici l'E2E ouvre la seule position où ces écrans existent.
        #
        # `WN_CB_RESULTS_ENABLED` (étage 2, résultats réels) n'est PAS posé en
        # production : ici le banc ouvre la seule position où la surface de
        # saisie existe, au lieu d'aligner l'E2E sur la production comme le
        # font les deux drapeaux au-dessus.
        env:
          WN_CB_ENABLED: 'true'
          WN_CB_PROPOSITION: 'true'
          WN_CB_RESULTS_ENABLED: 'true'
          WN_CE_QUI_COMPTE: 'true'
          WN_COMPREHENSION: 'true'
          WN_DOSSIER_DEUX_VOIX: 'true'
        run: npm run build

      # Installation des navigateurs placée juste avant les E2E, et non en tête
      # de job : tout échec statique (type-check, Vitest, lint, build) rendait
      # sinon la main après avoir payé ~1 min de téléchargement inutile.
      - name: Cache navigateurs Playwright
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium webkit

      # E2E contre le build de production produit plus haut : plus rapide (pas
      # de compilation à la demande de next dev) et plus fidèle au déploiement
      # Vercel (bundles React prod, prerender identique).
      - name: E2E tests (Playwright, production build)
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        env:
          PLAYWRIGHT_WEB_SERVER: start
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          # `error` ET NON LE DÉFAUT `warn` : sans rapporteur `html`, ce dossier
          # n'existait pas et l'étape publiait le vide sans rien dire. Une étape
          # de diagnostic qui échoue en silence est pire que pas d'étape — on la
          # croit là le jour où on en a besoin.
          if-no-files-found: error
          retention-days: 7
